<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1017">
<meta name="mobile-web-app-capable" content="yes">
<title>Efesios · Memorización RVR1960</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0d1017; --card:#171c26; --card2:#1f2634; --line:#2b3446;
  --txt:#e9edf5; --dim:#8b97ad; --gold:#e8b04b; --blue:#5b8cff;
  --green:#3ecf7a; --red:#f0625d;
}
html,body{margin:0;padding:0;height:100%;}
body{
  background:#0d1017;
  background-image:radial-gradient(120% 70% at 50% 0%,#1a2440 0%,#0d1017 60%);
  background-repeat:no-repeat;
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  font-size:16px;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;cursor:pointer;}
input{font-family:inherit;}

/* ---------- Pantallas ---------- */
.screen{display:none;flex-direction:column;height:100vh;height:100dvh;width:100%;}
.screen.active{display:flex;}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px 20px;}

/* ---------- Home ---------- */
.hero{text-align:center;padding:14px 0 22px;}
.hero h1{
  margin:0;font-size:38px;letter-spacing:-1px;font-weight:800;
  background:linear-gradient(135deg,#e8b04b,#f4d68a 45%,#5b8cff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero p{margin:6px 0 0;color:var(--dim);font-size:13.5px;letter-spacing:.4px;}

.sec{
  font-size:12px;text-transform:uppercase;letter-spacing:1.6px;
  color:var(--dim);margin:22px 0 10px;font-weight:700;
}
.sec:first-of-type{margin-top:0;}

.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
.chip{
  background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  padding:15px 4px;font-size:18px;font-weight:700;color:var(--dim);
  transition:.16s;display:flex;align-items:center;justify-content:center;
}
.chip.on{
  background:linear-gradient(160deg,#2b3a63,#1d2740);
  border-color:var(--blue);color:#fff;
  box-shadow:0 0 0 1px rgba(91,140,255,.35),0 6px 18px -8px #5b8cff;
}
.chip.mix{grid-column:span 4;font-size:15px;padding:13px 4px;letter-spacing:.4px;}
.chip.mix.on{
  background:linear-gradient(160deg,#5a4318,#382a0f);
  border-color:var(--gold);color:#ffe6b0;
  box-shadow:0 0 0 1px rgba(232,176,75,.35),0 6px 18px -8px #e8b04b;
}

.modes{display:flex;flex-direction:column;gap:9px;}
.mode{
  display:flex;align-items:center;gap:13px;text-align:left;
  background:var(--card);border:1.5px solid var(--line);border-radius:15px;
  padding:13px 14px;transition:.16s;
}
.mode .ico{font-size:22px;width:40px;height:40px;flex:0 0 40px;
  display:flex;align-items:center;justify-content:center;
  background:var(--card2);border-radius:11px;}
.mode .tx b{display:block;font-size:15px;font-weight:700;}
.mode .tx span{display:block;font-size:12.5px;color:var(--dim);margin-top:2px;}
.mode.on{
  border-color:var(--gold);
  background:linear-gradient(135deg,#241d0f,#171c26);
  box-shadow:0 0 0 1px rgba(232,176,75,.28);
}
.mode.on .ico{background:#3a2d12;}

.homefoot{padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(13,16,23,.92);}
.primary{
  width:100%;padding:17px;border-radius:15px;font-size:17px;font-weight:800;
  background:linear-gradient(135deg,#e8b04b,#d99a2b);color:#1a1306;
  letter-spacing:.3px;box-shadow:0 8px 22px -10px #e8b04b;
}
.primary:active{transform:scale(.985);}

.mini{font-size:12.5px;color:var(--dim);text-align:center;margin-top:12px;line-height:1.6;}
.mini b{color:var(--gold);}

/* ---------- Juego ---------- */
.ghead{
  display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  border-bottom:1px solid var(--line);
}
.icon-btn{
  width:40px;height:40px;flex:0 0 40px;border-radius:12px;background:var(--card);
  border:1px solid var(--line);font-size:19px;display:flex;align-items:center;justify-content:center;
}
.icon-btn:active{background:var(--card2);}
.ghead-info{flex:1;min-width:0;}
.ghead-title{font-size:15px;font-weight:800;}
.ghead-sub{font-size:12px;color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ghead-count{
  font-size:12.5px;font-weight:800;color:var(--gold);background:var(--card);
  border:1px solid var(--line);padding:6px 10px;border-radius:10px;flex:0 0 auto;
}
.progress-line{height:3px;background:#1a2030;}
.progress-line > div{height:100%;width:0;background:linear-gradient(90deg,#e8b04b,#5b8cff);transition:width .3s;}

.gbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 16px;}
.gfoot{
  padding:11px 16px calc(13px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:rgba(13,16,23,.95);
  display:flex;gap:9px;
}
.gfoot button{
  flex:1;padding:15px 10px;border-radius:14px;font-weight:800;font-size:15px;
  border:1.5px solid var(--line);background:var(--card);transition:.15s;
}
.gfoot button:active{transform:scale(.98);}
.gfoot .b-gold{background:linear-gradient(135deg,#e8b04b,#d99a2b);color:#1a1306;border-color:transparent;}
.gfoot .b-green{background:linear-gradient(135deg,#3ecf7a,#2ba85f);color:#04220f;border-color:transparent;}
.gfoot .b-red{background:#2a1a1c;border-color:#5c2b2b;color:#ff9b97;}
.gfoot .b-blue{background:linear-gradient(135deg,#5b8cff,#3f6fe0);color:#fff;border-color:transparent;}

/* ---------- Flashcard ---------- */
.flash-wrap{
  background:var(--card);border:1.5px solid var(--line);border-radius:20px;
  padding:30px 20px;min-height:52vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;transition:.2s;
}
.flash-ref{font-size:26px;font-weight:800;color:var(--gold);letter-spacing:-.5px;}
.flash-hint{margin-top:16px;font-size:13px;color:var(--dim);}
.flash-text{
  margin-top:20px;font-size:18.5px;line-height:1.75;text-align:left;
  animation:fade .25s ease;
}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hidden{display:none;}

/* ---------- Completar ---------- */
.verse-box{
  background:var(--card);border:1.5px solid var(--line);border-radius:18px;
  padding:20px 17px;font-size:17.5px;line-height:2.5;
}
.verse-ref{
  display:inline-block;font-size:12px;font-weight:800;color:var(--gold);
  background:#241d0f;border:1px solid #4a3a18;padding:3px 9px;border-radius:8px;
  margin-bottom:12px;letter-spacing:.4px;
}
.blank{
  display:inline-block;
  width:5ch;min-width:52px;max-width:100%;
  background:transparent;
  border:none;border-bottom:2px solid var(--gold);
  color:var(--gold);font-size:17px;font-weight:700;text-align:center;
  padding:0 2px 1px;margin:0 1px;border-radius:2px;
  outline:none;
}
.blank:focus{border-bottom-color:var(--blue);background:rgba(91,140,255,.09);color:#cfe0ff;}
.blank.ok{border-bottom-color:var(--green);color:var(--green);}
.blank.bad{border-bottom-color:var(--red);color:var(--red);background:rgba(240,98,93,.09);}
.corrections{
  margin-top:14px;padding:12px 14px;border-radius:13px;background:#20161a;
  border:1px solid #4a2a2a;font-size:14px;line-height:1.9;
}
.corrections b{display:block;color:#ff9b97;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px;}
.cw{display:inline-block;background:#2e1e22;border:1px solid #5c3333;color:#ffc9c6;
  padding:2px 9px;border-radius:8px;margin:2px 4px 2px 0;font-weight:600;}
.ok-msg{
  margin-top:14px;padding:13px;border-radius:13px;text-align:center;font-weight:800;
  background:#12261a;border:1px solid #235c3a;color:var(--green);font-size:15px;
}

/* ---------- Opción múltiple / Referencia ---------- */
.gap{
  display:inline-block;min-width:100px;border-bottom:2px dashed var(--gold);
  color:var(--gold);text-align:center;font-weight:700;
}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:16px;}
.opt{
  text-align:left;padding:15px 16px;border-radius:14px;background:var(--card);
  border:1.5px solid var(--line);font-size:15.5px;line-height:1.5;transition:.15s;
}
.opt:active{background:var(--card2);}
.opt.ok{background:#12261a;border-color:var(--green);color:var(--green);font-weight:700;}
.opt.bad{background:#20161a;border-color:var(--red);color:#ff9b97;}
.opt[disabled]{opacity:.85;}

/* ---------- Ordenar ---------- */
.target{
  min-height:110px;background:var(--card);border:1.5px dashed var(--line);
  border-radius:16px;padding:13px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;
  margin-bottom:16px;
}
.target.empty::before{content:'Toca las palabras en orden…';color:#4c5670;font-size:13.5px;}
.pool{display:flex;flex-wrap:wrap;gap:7px;}
.wchip{
  padding:10px 13px;border-radius:11px;background:var(--card2);
  border:1.5px solid var(--line);font-size:15.5px;font-weight:600;
}
.wchip:active{transform:scale(.95);}
.wchip.placed{background:#2b2410;border-color:var(--gold);color:#ffe1a6;}
.wchip.ok{background:#12261a;border-color:var(--green);color:var(--green);}
.wchip.bad{background:#20161a;border-color:var(--red);color:#ff9b97;}

/* ---------- Resultados ---------- */
.result-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;gap:6px;}
.result-big{font-size:58px;margin-bottom:6px;}
.result-wrap h2{margin:0;font-size:24px;font-weight:800;}
.result-wrap p{color:var(--dim);margin:6px 0 0;font-size:14px;}
.stats{display:flex;gap:11px;margin-top:26px;}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:15px;padding:15px 22px;min-width:96px;}
.stat b{display:block;font-size:26px;font-weight:800;}
.stat span{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;}
.stat.g b{color:var(--green);} .stat.r b{color:var(--red);}
</style>
</head>
<body>

<!-- ================= HOME ================= -->
<section id="home" class="screen active">
  <div class="scroll">
    <div class="hero">
      <h1>EFESIOS</h1>
      <p>Memorización · Reina-Valera 1960</p>
    </div>

    <h2 class="sec">Capítulos a repasar</h2>
    <div class="chips" id="chips">
      <button class="chip on" data-ch="1">1</button>
      <button class="chip" data-ch="2">2</button>
      <button class="chip" data-ch="3">3</button>
      <button class="chip" data-ch="4">4</button>
      <button class="chip" data-ch="5">5</button>
      <button class="chip" data-ch="6">6</button>
      <button class="chip mix" data-ch="mix">★ Mezcla de todos los capítulos</button>
    </div>

    <h2 class="sec">Modo de juego</h2>
    <div class="modes" id="modes">
      <button class="mode on" data-mode="fill">
        <span class="ico">✍️</span>
        <span class="tx"><b>Completar palabras</b><span>Rellena las palabras que faltan</span></span>
      </button>
      <button class="mode" data-mode="flash">
        <span class="ico">🃏</span>
        <span class="tx"><b>Flashcards</b><span>Mira la referencia y recita de memoria</span></span>
      </button>
      <button class="mode" data-mode="choice">
        <span class="ico">🔘</span>
        <span class="tx"><b>Opción múltiple</b><span>Elige la frase correcta</span></span>
      </button>
      <button class="mode" data-mode="order">
        <span class="ico">🔀</span>
        <span class="tx"><b>Ordenar palabras</b><span>Arma el versículo en orden</span></span>
      </button>
      <button class="mode" data-mode="ref">
        <span class="ico">🔢</span>
        <span class="tx"><b>Referencia</b><span>¿De qué capítulo y versículo es?</span></span>
      </button>
    </div>

    <div class="mini" id="progressInfo"></div>
  </div>
  <div class="homefoot">
    <button class="primary" id="btnStart">Comenzar entrenamiento</button>
  </div>
</section>

<!-- ================= JUEGO ================= -->
<section id="game" class="screen">
  <header class="ghead">
    <button class="icon-btn" id="btnBack">←</button>
    <div class="ghead-info">
      <div class="ghead-title" id="gTitle">Completar</div>
      <div class="ghead-sub" id="gSub">Efesios 1:1</div>
    </div>
    <div class="ghead-count" id="gCount">1/23</div>
  </header>
  <div class="progress-line"><div id="pbar"></div></div>
  <div class="gbody" id="gbody"></div>
  <footer class="gfoot" id="gfoot"></footer>
</section>

<!-- ================= RESULTADO ================= -->
<section id="done" class="screen">
  <div class="result-wrap">
    <div class="result-big" id="doneIcon">🎉</div>
    <h2 id="doneTitle">¡Sesión completada!</h2>
    <p id="doneSub">Sigue así, la Palabra está siendo guardada en tu corazón.</p>
    <div class="stats">
      <div class="stat g"><b id="doneOk">0</b><span>Correctas</span></div>
      <div class="stat r"><b id="doneFail">0</b><span>Para repasar</span></div>
    </div>
  </div>
  <div class="gfoot">
    <button class="b-blue" id="btnAgain">Repetir</button>
    <button class="b-gold" id="btnHome">Inicio</button>
  </div>
</section>

<script>
/* =========================================================

"En él también vosotros, habiendo oído la palabra de verdad, el evangelio de vuestra salvación, y habiendo creído en él, fuisteis sellados con el Espíritu Santo de la promesa,",

2:[

4:[

/* =========================================================
   UTILIDADES
   ========================================================= */
const $ = id => document.getElementById(id);
const VERSES = [];
for (const ch in BIBLE) BIBLE[ch].forEach((t,i)=>VERSES.push({ch:+ch, vs:i+1, text:t}));
const ref = v => `Efesios ${v.ch}:${v.vs}`;
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function norm(s){
  return (s||'').toString().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9\s]/g,' ')
    .replace(/\s+/g,' ').trim();
}
function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms||8); }catch(e){} }

/* Tokenizador: separa palabras, puntuación y espacios */
const WORDCHARS = 'A-Za-zÁÉÍÓÚÜÑáéíóúüñ';
function tokenize(text){
  const re = new RegExp(`([${WORDCHARS}]+)|([^${WORDCHARS}\\s]+)|(\\s+)`,'g');
  const out=[]; let m;
  while((m=re.exec(text))!==null){
    if(m[1]) out.push({type:'w',val:m[1]});
    else if(m[2]) out.push({type:'p',val:m[2]});
    else out.push({type:'s',val:' '});
  }
  return out;
}

/* =========================================================
   PROGRESO (localStorage)
   ========================================================= */
const PKEY='efesios_rvr60_progress_v1';
let progress = {};
try{ progress = JSON.parse(localStorage.getItem(PKEY)||'{}'); }catch(e){ progress={}; }
function saveProgress(){ try{ localStorage.setItem(PKEY, JSON.stringify(progress)); }catch(e){} }
function markVerse(v, ok){
  const k=v.ch+':'+v.vs;
  progress[k]=progress[k]||{ok:0,fail:0};
  if(ok) progress[k].ok++; else progress[k].fail++;
  saveProgress();
}
function masteredCount(){
  return Object.values(progress).filter(p=>p.ok>=3).length;
}
function updateProgressInfo(){
  const total=VERSES.length, m=masteredCount();
  const pct=Math.round(m/total*100);
  $('progressInfo').innerHTML =
    `Versículos dominados: <b>${m}/${total}</b> (${pct}%)<br>` +
    `Se marca como dominado tras 3 aciertos.`;
}

   ESTADO
   ========================================================= */
const selected = new Set([1]);
let mixMode = false;
let currentMode = 'fill';
let G = null;

const MODES = {
  fill:  'Completar palabras',
  flash: 'Flashcards',
  choice:'Opción múltiple',
  order: 'Ordenar palabras',
  ref:   'Referencia'
};

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
}

/* =========================================================
   HOME
   ========================================================= */
$('chips').addEventListener('click', e=>{
  const btn = e.target.closest('.chip'); if(!btn) return;
  buzz();
  const ch = btn.dataset.ch;
  if(ch==='mix'){
    mixMode = !mixMode;
    if(mixMode){ selected.clear(); [1,2,3,4,5,6].forEach(c=>selected.add(c)); }
    else { selected.clear(); selected.add(1); }
  } else {
    mixMode = false;
    const n = +ch;
    if(selected.has(n)) selected.delete(n); else selected.add(n);
    if(selected.size===0) selected.add(n);
  }
  renderChips();
});

function renderChips(){
  document.querySelectorAll('#chips .chip').forEach(b=>{
    if(b.dataset.ch==='mix'){ b.classList.toggle('on', mixMode); }
    else { b.classList.toggle('on', selected.has(+b.dataset.ch)); }
  });
}

$('modes').addEventListener('click', e=>{
  const btn = e.target.closest('.mode'); if(!btn) return;
  buzz();
  currentMode = btn.dataset.mode;
  document.querySelectorAll('.mode').forEach(m=>m.classList.toggle('on', m===btn));
});

$('btnStart').addEventListener('click', startGame);
$('btnBack').addEventListener('click', ()=>{ show('home'); updateProgressInfo(); });
$('btnHome').addEventListener('click', ()=>{ show('home'); updateProgressInfo(); });
$('btnAgain').addEventListener('click', ()=>{ show('game'); buildQueue(); nextCard(); });

/* =========================================================
   MOTOR DEL JUEGO
   ========================================================= */
function startGame(){
  buzz(15);
  buildQueue();
  $('gTitle').textContent = MODES[currentMode];
  show('game');
  nextCard();
}

function buildQueue(){
  let q = VERSES.filter(v=>selected.has(v.ch));
  if(mixMode || selected.size>1) shuffle(q);
  G = { mode:currentMode, queue:q, i:0, ok:0, fail:0, retry:[], current:null, revealed:false, checked:false };
  if(q.length===0){ G.queue=[VERSES[0]]; }
}

function updateHeader(){
  const total = G.queue.length;
  $('gCount').textContent = `${Math.min(G.i,total)}/${total}`;
  $('pbar').style.width = (total? (G.i/total*100):0)+'%';
}

function nextCard(){
  if(G.i >= G.queue.length){
    if(G.retry.length){
      G.queue = G.retry.slice(); shuffle(G.queue); G.retry=[]; G.i=0;
    } else { finish(); return; }
  }
  G.current = G.queue[G.i++];
  G.revealed = false;
  G.checked = false;
  $('gSub').textContent = ref(G.current);
  updateHeader();
  renderCurrent();
}

function finishCard(ok){
  if(ok){ G.ok++; markVerse(G.current,true); }
  else { G.fail++; markVerse(G.current,false); G.retry.push(G.current); }
  nextCard();
}

function finish(){
  $('pbar').style.width='100%';
  $('doneOk').textContent = G.ok;
  $('doneFail').textContent = G.fail;
  const total = G.ok+G.fail;
  const pct = total? Math.round(G.ok/total*100):0;
  if(pct>=90){ $('doneIcon').textContent='🏆'; $('doneTitle').textContent='¡Excelente trabajo!'; }
  else if(pct>=70){ $('doneIcon').textContent='🎉'; $('doneTitle').textContent='¡Muy bien!'; }
  else { $('doneIcon').textContent='💪'; $('doneTitle').textContent='¡Sigue practicando!'; }
  $('doneSub').textContent = `Acertaste el ${pct}% de los versículos de esta sesión.`;
  show('done');
}

function renderCurrent(){
  const body=$('gbody'), foot=$('gfoot');
  body.scrollTop=0;
  body.innerHTML=''; foot.innerHTML='';
  switch(G.mode){
    case 'fill': renderFill(); break;
    case 'flash': renderFlash(); break;
    case 'choice': renderChoice(); break;
    case 'order': renderOrder(); break;
    case 'ref': renderRef(); break;
  }
}

/* =========================================================
   MODO 1 · COMPLETAR PALABRAS
   ========================================================= */
function renderFill(){
  const v = G.current;
  const tokens = tokenize(v.text);
  const wordPos = [];
  tokens.forEach((t,i)=>{ if(t.type==='w') wordPos.push(i); });

  const nBlanks = Math.min(10, Math.max(1, Math.round(wordPos.length*0.28)));
  let pool = wordPos.filter(i=>tokens[i].val.length>=4);
  if(pool.length < nBlanks) pool = wordPos.slice();
  const chosen = shuffle(pool.slice()).slice(0,nBlanks).sort((a,b)=>a-b);
  const chosenSet = new Set(chosen);

  let html = '';
  tokens.forEach((t,i)=>{
    if(t.type==='s'){ html += ' '; }
    else if(t.type==='p'){ html += escapeHtml(t.val); }
    else if(chosenSet.has(i)){
      const w = t.val;
      const width = Math.max(4, w.length);
      html += `<input class="blank" data-ans="${escapeHtml(w)}" style="width:${width}ch" type="text"
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">`;
    } else {
      html += escapeHtml(t.val);
    }
  });

  $('gbody').innerHTML = `
    <div class="verse-ref">${ref(v)}</div>
    <div class="verse-box" id="verseBox">${html}</div>
    <div id="extra"></div>`;

  $('gfoot').innerHTML = `
    <button class="b-red" id="btnReveal">Ver respuesta</button>
    <button class="b-gold" id="btnCheck">Comprobar</button>`;

  $('btnCheck').addEventListener('click', checkFill);
  $('btnReveal').addEventListener('click', revealFill);

  const first = $('verseBox').querySelector('input.blank');
  if(first) setTimeout(()=>{ try{ first.focus(); }catch(e){} }, 120);
}

function checkFill(){
  buzz(12);
  const inputs = [...document.querySelectorAll('#verseBox input.blank')];
  const wrong = [];
  inputs.forEach(inp=>{
    const ok = inp.value.trim()!=='' && norm(inp.value)===norm(inp.dataset.ans);
    inp.classList.toggle('ok', ok);
    inp.classList.toggle('bad', !ok);
    if(ok) inp.readOnly = true; else wrong.push(inp.dataset.ans);
  });

  G.checked = true;
  const extra = $('extra');
  if(wrong.length===0){
    extra.innerHTML = `<div class="ok-msg">✓ ¡Perfecto! Versículo completo.</div>`;
    G.allRight = true;
  } else {
    extra.innerHTML = `<div class="corrections"><b>Correcciones</b>${
      wrong.map(w=>`<span class="cw">${escapeHtml(w)}</span>`).join('')
    }</div>`;
    G.allRight = false;
  }
  $('gfoot').innerHTML = `<button class="b-gold" id="btnNext">Siguiente →</button>`;
  $('btnNext').addEventListener('click', ()=>finishCard(!!G.allRight));
}

function revealFill(){
  buzz(12);
  const inputs = [...document.querySelectorAll('#verseBox input.blank')];
  inputs.forEach(inp=>{
    inp.value = inp.dataset.ans;
    inp.classList.remove('ok','bad');
    inp.classList.add('bad');
    inp.readOnly = true;
  });
  G.checked = true;
  G.allRight = false;
  $('extra').innerHTML = `<div class="corrections"><b>Respuesta correcta</b>Lee el versículo completo en voz alta un par de veces.</div>`;
  $('gfoot').innerHTML = `<button class="b-gold" id="btnNext">Siguiente →</button>`;
  $('btnNext').addEventListener('click', ()=>finishCard(false));
}

/* =========================================================
   MODO 2 · FLASHCARDS
   ========================================================= */
function renderFlash(){
  const v = G.current;
  $('gbody').innerHTML = `
    <div class="flash-wrap" id="flashWrap">
      <div class="flash-ref">${ref(v)}</div>
      <div class="flash-hint" id="flashHint">Toca para revelar el versículo</div>
      <div class="flash-text hidden" id="flashText">${escapeHtml(v.text)}</div>
    </div>`;
  $('gfoot').innerHTML = `<button class="b-gold" id="btnSkip">Saltar</button>`;

  $('flashWrap').addEventListener('click', ()=>{
    if(G.revealed) return;
    G.revealed = true; buzz(10);
    $('flashHint').classList.add('hidden');
    $('flashText').classList.remove('hidden');
    $('gfoot').innerHTML = `
      <button class="b-red" id="btnNo">✗ Repasar</button>
      <button class="b-green" id="btnYes">✓ La sabía</button>`;
    $('btnYes').addEventListener('click', ()=>finishCard(true));
    $('btnNo').addEventListener('click', ()=>finishCard(false));
  });

  $('btnSkip').addEventListener('click', ()=>finishCard(false));
}

/* =========================================================
   MODO 3 · OPCIÓN MÚLTIPLE
   ========================================================= */
function renderChoice(){
  const v = G.current;
  const words = v.text.split(/\s+/);
  const len = words.length < 18 ? 3 : 4;
  let start = 0;
  if(words.length - len > 1) start = 1 + Math.floor(Math.random()*(words.length-len-1));
  const correct = words.slice(start, start+len).join(' ');

  const pool = [];
  const seen = new Set([norm(correct)]);
  VERSES.forEach(x=>{
    if(x===v) return;
    const w = x.text.split(/\s+/);
    for(let i=0;i+len<=w.length;i++){
      const s = w.slice(i,i+len).join(' ');
      if(!seen.has(norm(s))){ seen.add(norm(s)); pool.push(s); }
    }
  });
  shuffle(pool);
  const opts = [correct, ...pool.slice(0,3)];
  shuffle(opts);

  const before = words.slice(0,start).join(' ');
  const after = words.slice(start+len).join(' ');

  $('gbody').innerHTML = `
    <div class="verse-ref">${ref(v)}</div>
    <div class="verse-box">
      ${escapeHtml(before)} <span class="gap">¿ ?</span> ${escapeHtml(after)}
    </div>
    <div class="opts" id="opts">
      ${opts.map((o,i)=>`<button class="opt" data-i="${i}">${escapeHtml(o)}</button>`).join('')}
    </div>`;

  $('gfoot').innerHTML = '';

  $('opts').addEventListener('click', e=>{
    const b = e.target.closest('.opt'); if(!b) return;
    const picked = opts[+b.dataset.i];
    const ok = norm(picked)===norm(correct);
    [...document.querySelectorAll('.opt')].forEach(x=>{
      x.disabled = true;
      if(norm(opts[+x.dataset.i])===norm(correct)) x.classList.add('ok');
    });
    if(!ok) b.classList.add('bad');
    buzz(ok?14:35);
    G.allRight = ok;
    $('gfoot').innerHTML = `<button class="b-gold" id="btnNext">Siguiente →</button>`;
    $('btnNext').addEventListener('click', ()=>finishCard(ok));
    if(ok) setTimeout(()=>{ if($('btnNext')) finishCard(true); }, 800);
  });
}

/* =========================================================
   MODO 4 · ORDENAR PALABRAS
   ========================================================= */
function renderOrder(){
  const v = G.current;
  let words = v.text.split(/\s+/);
  let truncated = false;
  if(words.length > 13){ words = words.slice(0,13); truncated = true; }
  const target = words.join(' ');

  let items = words.map((w,i)=>({id:i,w}));
  let pool = shuffle(items.slice());
  let placed = [];

  $('gbody').innerHTML = `
    <div class="verse-ref">${ref(v)}</div>
    ${truncated?'<div class="mini" style="text-align:left;margin:0 0 10px">Se muestran las primeras 13 palabras.</div>':''}
    <div class="target empty" id="target"></div>
    <div class="pool" id="poolBox"></div>
    <div id="extra"></div>`;

  $('gfoot').innerHTML = `
    <button class="b-red" id="btnRevealO">Ver respuesta</button>
    <button class="b-gold" id="btnCheckO">Comprobar</button>`;

  function draw(){
    const t = $('target'), p = $('poolBox');
    t.innerHTML = placed.map(x=>`<button class="wchip placed" data-id="${x.id}">${escapeHtml(x.w)}</button>`).join('');
    t.classList.toggle('empty', placed.length===0);
    p.innerHTML = pool.map(x=>`<button class="wchip" data-id="${x.id}">${escapeHtml(x.w)}</button>`).join('');
  }

  $('gbody').addEventListener('click', e=>{
    const b = e.target.closest('.wchip'); if(!b || G.checked) return;
    const id = +b.dataset.id;
    const inPool = pool.findIndex(x=>x.id===id);
    if(inPool>=0){
      placed.push(pool.splice(inPool,1)[0]);
    } else {
      const inPlaced = placed.findIndex(x=>x.id===id);
      if(inPlaced>=0) pool.push(placed.splice(inPlaced,1)[0]);
    }
    buzz(6);
    draw();
  });

  $('btnCheckO').addEventListener('click', ()=>{
    G.checked = true;
    const built = placed.map(x=>x.w).join(' ');
    const ok = norm(built)===norm(target);
    document.querySelectorAll('.wchip').forEach(c=>{
      const w = words.find((_,i)=>String(i)===c.dataset.id) || '';
      c.classList.remove('placed','ok','bad');
      c.classList.add(ok?'ok':'bad');
    });
    buzz(ok?14:35);
    if(ok){
      $('extra').innerHTML = `<div class="ok-msg">✓ ¡Orden correcto!</div>`;
    } else {
      $('extra').innerHTML = `<div class="corrections"><b>Orden correcto</b>${escapeHtml(target)}</div>`;
    }
    $('gfoot').innerHTML = `<button class="b-gold" id="btnNext">Siguiente →</button>`;
    $('btnNext').addEventListener('click', ()=>finishCard(ok));
  });

  $('btnRevealO').addEventListener('click', ()=>{
    G.checked = true;
    placed = items.slice();
    pool = [];
    draw();
    document.querySelectorAll('.wchip').forEach(c=>c.classList.add('bad'));
    $('extra').innerHTML = `<div class="corrections"><b>Respuesta correcta</b>${escapeHtml(target)}</div>`;
    $('gfoot').innerHTML = `<button class="b-gold" id="btnNext">Siguiente →</button>`;
    $('btnNext').addEventListener('click', ()=>finishCard(false));
  });

  draw();
}

/* =========================================================
   MODO 5 · REFERENCIA
   ========================================================= */
function renderRef(){
  const v = G.current;
  const opts = [v];
  const others = VERSES.filter(x=>x!==v);
  shuffle(others);
  for(const o of others){
    if(opts.length>=4) break;
    if(opts.some(x=>x.ch===o.ch && x.vs===o.vs)) continue;
    if(norm(o.text)===norm(v.text)) continue;
    opts.push(o);
  }
  shuffle(opts);

  $('gbody').innerHTML = `
    <div class="verse-ref">¿De qué referencia es?</div>
    <div class="verse-box">${escapeHtml(v.text)}</div>
    <div class="opts" id="opts">
      ${opts.map((o,i)=>`<button class="opt" data-i="${i}" style="text-align:center;font-weight:700">${ref(o)}</button>`).join('')}
    </div>`;

  $('gfoot').innerHTML = '';

  $('opts').addEventListener('click', e=>{
    const b = e.target.closest('.opt'); if(!b) return;
    const o = opts[+b.dataset.i];
    const ok = (o.ch===v.ch && o.vs===v.vs);
    [...document.querySelectorAll('.opt')].forEach(x=>{
      x.disabled = true;
      const oo = opts[+x.dataset.i];
      if(oo.ch===v.ch && oo.vs===v.vs) x.classList.add('ok');
    });
    if(!ok) b.classList.add('bad');
    buzz(ok?14:35);
    $('gfoot').innerHTML = `<button class="b-gold" id="btnNext">Siguiente →</button>`;
    $('btnNext').addEventListener('click', ()=>finishCard(ok));
    if(ok) setTimeout(()=>{ if($('btnNext')) finishCard(true); }, 800);
  });
}

/* =========================================================
   INICIO
   ========================================================= */
renderChips();
updateProgressInfo();
</script>
